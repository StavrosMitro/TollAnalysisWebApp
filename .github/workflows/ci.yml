name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# PR code never receives secrets and no job needs repository write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Official action major version deliberately pinned to v4.
      - uses: actions/checkout@v4
      - name: Validate whitespace and secret-path protections
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git check-ignore -q .env.aiven.local
          git check-ignore -q .secrets/ca.pem
          for path in .env.aiven.local .secrets/ca.pem; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "refusing tracked local secret path: $path" >&2
              exit 1
            fi
          done

  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      # Node 20 matches the production Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - name: Confirm tests did not alter tracked files
        working-directory: .
        run: git diff --exit-code && git diff --cached --exit-code

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
      - name: Confirm tests and build did not alter tracked files
        working-directory: .
        run: git diff --exit-code && git diff --cached --exit-code

  mysql-integration:
    name: Disposable MySQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - run: npm ci
      # The existing wrapper owns a mysql:8 container, waits for a query-ready
      # server, sets NODE_ENV=test/ALLOW_DESTRUCTIVE_TESTS, and removes it.
      - run: npm run test:integration
      - name: Remove the wrapper-owned disposable database on failure
        if: always()
        run: bash scripts/integration-db.sh down
      - name: Confirm tests did not alter tracked files
        working-directory: .
        run: git diff --exit-code && git diff --cached --exit-code

  ml:
    name: Pinned ML tests and artifact smoke
    # The pinned ML container builds the roughly 945 MB production image.
    # Run it for protected main and manual release validation, not every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ml run --rm ml -m ml.tests
      - run: docker compose --profile ml run --rm ml -m ml.smoke_test
      - name: Remove disposable Compose resources
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Confirm ML checks did not alter tracked files
        run: git diff --exit-code && git diff --cached --exit-code

  docker-production:
    name: Production image build and secret-path check
    # Keep the large build on main/manual validation; PRs retain the fast
    # deterministic test jobs above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag toll-analysis:ci .
      - name: Confirm local secret paths are absent from the image
        run: |
          docker run --rm --entrypoint sh toll-analysis:ci -c '
            test ! -e /app/.env &&
            test ! -e /app/.env.aiven.local &&
            test ! -e /app/.secrets &&
            test ! -e /app/back-end/.env
          '
      - name: Confirm image build did not alter tracked files
        run: git diff --exit-code && git diff --cached --exit-code
