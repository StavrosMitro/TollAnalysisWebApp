# Toll Analysis - local / demo stack.
#
#   docker compose up --build
#
# Brings up MySQL 8 (deterministically initialised from ./db/init) and one
# application container that serves the React production build AND the REST API
# on a single origin: http://localhost:9115
#
# All configuration has safe local defaults; override via a .env file next to
# this one (see .env.example). For any non-local deployment you MUST set a
# strong JWT_SECRET and real database credentials.

services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
      MYSQL_DATABASE: ${DATABASE:-toll_analysis}
      MYSQL_USER: ${DUSER:-toll_app}
      MYSQL_PASSWORD: ${PASSWORD:-toll_app_local_only}
    volumes:
      - db_data:/var/lib/mysql
      # Verbatim copies of Database_mysql/{schema,data}.sql - run once on an
      # empty data volume, in filename order.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_local_only}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      # Only the checked-in local compose stack may use its throwaway DB/JWT
      # defaults. Never set this on a hosted deployment.
      ALLOW_INSECURE_LOCAL_DEFAULTS: "true"
      PORT: 9115
      # DB connection (service name "db" on the compose network).
      HOST: db
      DB_PORT: 3306
      DUSER: ${DUSER:-toll_app}
      PASSWORD: ${PASSWORD:-toll_app_local_only}
      DATABASE: ${DATABASE:-toll_analysis}
      # Must be >=32 bytes of high-entropy material (openssl rand -hex 32) or the
      # app refuses to start in production. The default here is a valid-shaped
      # THROWAWAY for zero-config local runs - override in .env for anything shared.
      JWT_SECRET: ${JWT_SECRET:-fb3afa47072220b5dc1798863721abb11e1c6272afe911376655a2363f4b6eaa}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      DEMO_TOKEN_TTL_MINUTES: ${DEMO_TOKEN_TTL_MINUTES:-90}
      # Same-origin in this stack -> no cross-origin access needed.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Block model training / DB resets / debt mutation / bulk upload.
      DISABLE_DESTRUCTIVE_OPS: ${DISABLE_DESTRUCTIVE_OPS:-true}
      PUBLIC_DEMO_MODE: ${PUBLIC_DEMO_MODE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      INFERENCE_TIMEOUT_MS: ${INFERENCE_TIMEOUT_MS:-20000}
      INFERENCE_MAX_CONCURRENT: ${INFERENCE_MAX_CONCURRENT:-2}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-9115}:9115"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9115/livez"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ML pipeline runner. NOT part of the normal stack - opt in with the profile:
  #   docker compose --profile ml run --rm ml -m ml.validate_data
  #   docker compose --profile ml run --rm ml -m ml.train_all
  #   docker compose --profile ml run --rm ml -m ml.evaluate_all
  #   docker compose --profile ml run --rm ml -m ml.evaluate_legacy
  #   docker compose --profile ml run --rm ml -m ml.smoke_test
  # Reuses the app image (identical pinned Python + scikit-learn) and mounts the
  # backend source so regenerated artifacts/reports land on the host.
  ml:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ml"]
    working_dir: /app/back-end
    environment:
      PYTHONPATH: /app/back-end
      PYTHONDONTWRITEBYTECODE: "1"
      HOST: db
      DB_PORT: 3306
      DUSER: ${DUSER:-toll_app}
      PASSWORD: ${PASSWORD:-toll_app_local_only}
      DATABASE: ${DATABASE:-toll_analysis}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    volumes:
      - ./back-end/ml:/app/back-end/ml
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/opt/venv/bin/python"]
    command: ["-m", "ml.validate_data"]

  # Optional DB browser. NOT part of the normal stack:
  #   docker compose --profile tools up
  adminer:
    image: adminer:4
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_HOST_PORT:-8081}:8080"

volumes:
  db_data:
